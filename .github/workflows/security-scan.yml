name: Security & Secret Leak Scanner

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'assets/icons/README.md'
      - 'docs/README.md'
      - 'homelab/unraid/user-scripts/Common user scripts for unraid.md'
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Deep scan commit history and PR diffs

      - name: Run Gitleaks Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
