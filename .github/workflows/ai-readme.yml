name: Documentation & README Auto-Update

on:
  push:
    branches:
      - main
    # Prevent infinite loops if we merge the doc update PR itself
    paths-ignore:
      - 'README.md'
      - 'assets/icons/README.md'
      - 'docs/README.md'
      - 'homelab/unraid/user-scripts/Common user scripts for unraid.md'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: ai-readme
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  scan-secrets:
    name: Secret & Key Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Deep scan so gitleaks can inspect commits

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-docs:
    name: Update Documentation & README
    needs: scan-secrets # Gated: only runs once secret scanner passes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to fetch the git commit history for the script

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install Dependencies
        working-directory: .github/scripts
        run: npm ci

      - name: Generate Subfolder Catalogs (Icons, Scripts, Docs)
        run: node .github/scripts/generate_docs.js

      - name: Generate Main README with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .github/scripts/update_readme.js

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: auto-update README and catalog documentation"
          title: "🤖 AI Update: Repository Structure & Logs"
          body: "This PR was automatically generated. It updates the main README to reflect latest changes and rebuilds subfolder catalogs (icons, Unraid scripts, and docs index)."
          branch: auto-update-readme
          delete-branch: true
          add-paths: |
            README.md
            assets/icons/README.md
            docs/README.md
            homelab/unraid/user-scripts/Common user scripts for unraid.md
