name: Documentation & README Auto-Update

on:
  push:
    branches:
      - main
    # Layer 1: Ignore documentation files to prevent workflow triggering on doc updates
    paths-ignore:
      - 'README.md'
      - 'assets/icons/README.md'
      - 'docs/README.md'
      - 'homelab/unraid/user-scripts/Common user scripts for unraid.md'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: ai-readme
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan-secrets:
    name: Secret & Key Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Deep scan so gitleaks can inspect commits

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-docs:
    name: Update Documentation & README
    needs: scan-secrets # Gated: only runs once secret scanner passes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to fetch the git commit history for the script

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install Dependencies
        working-directory: .github/scripts
        run: npm ci

      - name: Generate Subfolder Catalogs (Icons, Scripts, Docs)
        run: node .github/scripts/generate_docs.js

      - name: Generate Main README with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .github/scripts/update_readme.js

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/icons/README.md docs/README.md "homelab/unraid/user-scripts/Common user scripts for unraid.md"
          
          # Only commit and push if there are actual diffs
          if ! git diff --staged --quiet; then
            # Layer 2: [skip ci] explicitly instructs GitHub Actions not to trigger any workflow
            git commit -m "docs: auto-update README and catalog documentation [skip ci]"
            git push origin main
            echo "✅ Documentation updates committed and pushed directly to main with [skip ci]."
          else
            echo "ℹ️ No documentation changes detected. Nothing to commit."
          fi
